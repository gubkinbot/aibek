# Конфигурация OPC UA Tag Reader

# OPC UA сервер
opc:
  server_url: "opc.tcp://10.231.241.122:49320"
  # Таймаут подключения (мс)
  connect_timeout: 10000
  session_timeout: 30000

# Теги загружаются из таблицы ohangaron.tags в PostgreSQL

# PostgreSQL база данных
database:
  host: "localhost"
  port: 5432
  name: "CS"
  user: "postgres"
  password: "id6838"
  schema: "ohangaron"
  table: "raw_data"

# Сертификаты (относительно папки скрипта)
certificates:
  cert_file: "certificates/client_cert.der"
  key_file: "certificates/client_key.pem"

# Интервал опроса (секунды)
polling:
  interval: 300  # 5 минут

# Realtime данные (текущие значения)
realtime:
  enabled: true
  table: "realtime_data"
  interval: 1  # секунда

# Логирование
logging:
  file: "logs/opc_reader.log"
  # Уровень: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Максимальный размер файла (МБ)
  max_size_mb: 10
  # Сколько файлов хранить
  backup_count: 5
